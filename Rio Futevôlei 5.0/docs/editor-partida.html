<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor da Partida 5.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="editores.css">
<style>
.sl { display: flex; gap: 8px; align-items: center; min-width: 0; }
.sl input[type="range"] { flex: 1; min-width: 0; accent-color: var(--zone); }
.sl input[type="number"] { width: 84px; flex: none; }
.sl small { color: var(--muted); font-weight: 900; font-size: 12px; min-width: 24px; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.fig { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fig canvas { width: 100%; height: auto; border-radius: 8px; display: block; }
.fig b { font-size: 13px; color: var(--muted); font-weight: 900; }
.zone-card { border-left: 6px solid var(--c); padding-left: 12px; }
.mtab { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.mtab th { text-align: left; font: 900 11px var(--body); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 0 6px; }
.mtab td { vertical-align: top; padding: 6px; background: var(--surface-2); }
.mtab td:first-child { border-radius: 10px 0 0 10px; font-weight: 900; border-left: 6px solid var(--c); }
.mtab td:last-child { border-radius: 0 10px 10px 0; }
.mv { display: grid; grid-template-columns: minmax(0, 1fr) 96px 64px 28px; gap: 4px; margin-bottom: 4px; align-items: center; }
.mv input, .mv select { min-width: 0; width: 100%; padding: 4px 6px; font-size: 13px; }
.mv button { padding: 2px 0; }
.mv-pct { font-size: 11px; color: var(--muted); font-weight: 900; }
.scroll-x { overflow-x: auto; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.slot { background: var(--surface-2); border-radius: 12px; padding: 10px; }
.slot h5 { margin: 0 0 6px; font: 900 14px var(--body); }
.slot h5 small { color: var(--muted); font-weight: 800; }
.slot ul { margin: 0; padding-left: 18px; font-weight: 800; font-size: 14px; }
.slot .none { color: var(--warn); font-weight: 900; font-size: 13px; }
.sp-row { display: grid; grid-template-columns: minmax(140px, 1.4fr) minmax(90px, 1fr) minmax(80px, 0.8fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.sp-row.off { opacity: .55; }
.sp-row b small { display: block; color: var(--muted); font-size: 11px; font-weight: 800; }
.form-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; }
.xz { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; }
.xz input { width: 100%; min-width: 0; }
.xz span { font-weight: 900; color: var(--muted); font-size: 12px; }
.paddia svg { width: 100%; height: auto; display: block; max-width: 900px; margin: 0 auto; }
.paddia .pdl { font: 800 13px var(--body); fill: var(--fg); }
.paddia .pdl.off { fill: var(--muted); }
.paddia .pdb { font: 900 11px var(--body); fill: #fff; }
.paddia .pds { font: 800 11px var(--body); fill: var(--muted); }
.pd-ico { display: inline-flex; vertical-align: middle; }
.pd-ico .pad-pill { display: inline-block; min-width: 26px; padding: 1px 6px; border-radius: 8px; background: #1d1a2b; color: #fff; font: 900 13px/18px var(--body); text-align: center; }
.act-card h4 { display: flex; align-items: center; gap: 8px; }
@media (max-width: 560px) { .sp-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <a class="back" href="index.html">← Editores</a>
      <h1>Editor da <span>Partida</span> 5.0</h1>
      <p class="kicker">Hitbox em 3 partes, golpes de cada parte, especiais de 50% e 100%, formações, saque e o controle (qual botão faz o quê e os ajustes de cada um). Grave e recarregue o jogo para ver.</p>
    </div>
    <div class="tools">
      <span id="padpick"></span>
      <span class="status" id="status"><i></i><span>carregando…</span></span>
      <button id="undo" type="button" disabled>Desfazer tudo</button>
      <button id="save" class="primary" type="button" disabled>Gravar no jogo</button>
    </div>
  </header>
  <div class="main">
    <nav id="nav" aria-label="Partes"></nav>
    <div class="editor" id="editor"></div>
  </div>
</div>
<script type="module">
import P5 from '../src/data/partida5.js';
import TILT from '../src/data/tilt.js';
import { MOVES } from '../src/moves.js';
import { CHARACTERS, ROSTER, BOSSES } from '../src/art/characters.js';
import { ROUTE, HOODS } from '../src/story/data.js'; // (também registra os atletas do Modo História)
import { drawAthlete } from '../src/art/draw.js';
import { poseFor } from '../src/art/poses.js';
import { dummy } from '../src/ui/portraits.js';
import { settings } from '../src/ui/settings.js';
import { clone, esc, saver, row, text, num, select, check, color, button, pad, padPicker, padStyle } from './editores.js';
import { V5, PAD_BUTTONS, PAD_ACTIONS, ACTION_DEFAULT, padIndex } from '../src/v5.js';
import { padGlyph } from '../src/ui/padIcons.js';
const P = a => pad(a), P2 = a => `${pad(a)} ${pad(a)}`; // nomes dos botões no controle escolhido

const original = JSON.stringify(P5);
let data = clone(P5);
let cur = 'hitbox';
const PARTS = [
  ['hitbox', '🎯', 'Hitbox em 3 partes'],
  ['alturas', '📏', 'Altura dos atletas'],
  ['golpes', '🦶', 'Golpes de cada parte'],
  ['especiais', '⭐', 'Especiais 50% e 100%'],
  ['historia', '📖', 'Especiais na história'],
  ['formacoes', '🧭', 'Formações'],
  ['saque', '🏐', 'Saque'],
  ['controle', '🎮', 'Controle (botões)'],
  ['campeonato', '🏆', 'Campeonato e sorteio'],
  ['atributos', '💪', 'Atributos (força, agilidade…)'],
];
const ZK = ['inferior', 'tronco', 'superior'];
const ANIMS = [['poke', 'Toque de pé'], ['kick', 'Chute'], ['thigh', 'Coxa'], ['chest', 'Peito'], ['shoulder', 'Ombro'], ['header', 'Cabeça']];
const SLOTS = [
  ['a1', 'Ataque 1', 'LB LB', 'ataque', 50], ['a2', 'Ataque 2', 'X X', 'ataque', 100],
  ['d1', 'Defesa 1', 'RB RB', 'defesa', 50], ['d2', 'Defesa 2', 'B B', 'defesa', 100],
];
settings.art = 'cartoon';

const S = saver({
  kind: 'partida', original, get: () => data,
  statusEl: document.getElementById('status'), saveBtn: document.getElementById('save'), undoBtn: document.getElementById('undo'),
  onRestore: d => { data = d; render(); },
  onUndo: () => { data = JSON.parse(original); render(); },
});
const changed = () => { S.dirty(); };
document.getElementById('padpick').append(padPicker(() => render()));

// ---------- peças ----------
function slider(value, set, { min = 0, max = 10, step = 0.01, unit = '' } = {}) {
  const box = document.createElement('div'); box.className = 'sl';
  const r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = value;
  const n = document.createElement('input'); n.type = 'number'; n.min = min; n.max = max; n.step = step; n.value = value;
  const u = document.createElement('small'); u.textContent = unit;
  const go = v => { v = Math.max(min, Math.min(max, +v || 0)); set(v); };
  r.oninput = () => { n.value = r.value; go(r.value); };
  n.oninput = () => { r.value = n.value; go(n.value); };
  box.append(r, n, u);
  return box;
}
const card = (title, ...kids) => { const s = document.createElement('section'); s.className = 'card'; if (title) s.innerHTML = `<h4>${title}</h4>`; s.append(...kids); return s; };
const hint = t => { const p = document.createElement('p'); p.className = 'hint'; p.textContent = t; return p; };
const fields = (...kids) => { const g = document.createElement('div'); g.className = 'fields'; g.append(...kids); return g; };
const col = (...kids) => { const d = document.createElement('div'); d.append(...kids); return d; };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const fig = (label, c) => { const d = el('div', 'fig'); d.append(el('b', '', esc(label)), c); return d; };
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const H = () => Math.max(0.5, +data.alturaAtleta || 1.85);
function bands(h = H()) {
  let lo = 0;
  return ZK.map(k => { const z = data.zonas[k]; const hi = Math.max(lo + 0.05, (+z.ate || 0) * h); const o = { k, lo, hi, cor: z.cor, nome: z.nome }; lo = hi; return o; });
}
if (!data.alturas) data.alturas = {};
// 5.0: aproximação, cara ou coroa, rede, opacidade e Campeonato
data.aproximacao = { perto: 0.45, velocidade: 8, min: 0.05, max: 0.16, ...(data.aproximacao || {}) };
data.caraOuCoroa = { cpuSaque: (data.parOuImpar && data.parOuImpar.cpuSaca) ?? 0.7, ...(data.caraOuCoroa || {}) };
delete data.parOuImpar;
data.rede = { limiteBola: 0.1, ...(data.rede || {}) };
data.aposToque = { opacidade: 0.5, ...(data.aposToque || {}) };
data.campeonato = { nome: 'Campeonato Rio Futevôlei', grupos: { pontos: 18, trocaLado: 6 }, quartas: { pontos: 18, trocaLado: 6 }, semifinal: { pontos: 18, trocaLado: 6 }, terceiro: { pontos: 18, trocaLado: 6 },
  final: { sets: [18, 18, 15], trocaLado: [6, 6, 5] }, temposTecnicos: 1, pontosTabela: { vitoria: 3, derrota: 1 }, premios: [300, 150, 80], arena: 'copacabana', clima: 'aleatorio', nivelVariacao: 2, ...(data.campeonato || {}) };
data.campeonato.quartas = data.campeonato.quartas || { ...data.campeonato.grupos };
data.campeonato.dificuldades = { facil: [1, 3, 5], medio: [3, 6, 9], dificil: [4, 8, 12], ...(data.campeonato.dificuldades || {}) };
// 5.0: efeitos dos atributos (valor = base com o atributo em 5 + (atributo − 5) × porPonto)
{ const D = { forca: { velocidadeBola: [1, 0.05] }, agilidade: { velocidadeQuadra: [1, 0.03], recuperacao: [1.05, -0.05] }, precisao: { erroMira: [0.5556, -0.1111] }, pique: { barraEspecial: [1, 0.08], notaRuim: [1, -0.08] } };
  data.atributos = data.atributos || {};
  for (const [a, ks] of Object.entries(D)) { data.atributos[a] = data.atributos[a] || {}; for (const [k, [b, p]] of Object.entries(ks)) data.atributos[a][k] = { base: b, porPonto: p, ...(data.atributos[a][k] || {}) }; } }
// 5.0: aba Controle
if (!data.controle) data.controle = {};
{ const C = data.controle;
  C.botoes = { ...ACTION_DEFAULT, ...(C.botoes || {}) };
  if (C.menuSegurar === undefined) C.menuSegurar = 2; // 5.0: padrão de controle dos menus
  C.andar = { velocidade: 5.4, aceleracao: 38, ...(C.andar || {}) };
  C.pulo = { forca: 5.4, ...(C.pulo || {}) };
  C.carrinho = { velocidade: 7.4, duracao: 0.42, recuperacao: 0.6, ...(C.carrinho || {}) };
  C.mira = { modo: 'giro', giro: 360, pausaMax: 3, andarSegurando: 0.75, alcance: 1.35, setaInicio: 0.7, setaFim: 1.4, setaCurva: 2, areaInicio: 0.8, areaFim: 1.3, tremorMax: 0.2, tremorSome: 0.5, ...(TILT.controle || {}), ...(C.mira || {}) }; }
const heightOf = id => +data.alturas[id] || H();
const spName = id => (TILT.specialDefs[id] && TILT.specialDefs[id].name) || (MOVES[id] ? MOVES[id].name.replace('!', '') : id);

// ---------- lista ----------
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  nav.append(el('h3', '', '<span>Partida 5.0</span>'));
  for (const [id, ico, name] of PARTS) {
    const b = el('button', 'it', `<span class="nm">${ico} ${esc(name)}</span>`); b.type = 'button';
    b.setAttribute('aria-current', String(id === cur));
    b.onclick = () => { cur = id; render(); };
    nav.append(b);
  }
}

// ---------- animação das prévias ----------
let anim = null, painters = [];
function loop(t) { for (const p of painters) p(t / 1000); anim = requestAnimationFrame(loop); }
function startPainters(list) { cancelAnimationFrame(anim); painters = list; anim = requestAnimationFrame(loop); }

// atleta com a hitbox: 1 m = 102,4 px no desenho (sprite de 2,5 m em 256 px, pé a 10 px do fundo)
const PX = 256 / 2.5, FEET = 10;
function athleteFig({ zones = true, special = false, anim: an = null, who = null } = {}) {
  const c = canvas(400, 300), g = c.getContext('2d');
  const off = canvas(256, 256), og = off.getContext('2d');
  return { c, paint: t => {
    const id = (typeof who === 'function' ? who() : who) || ROSTER.find(Boolean), ch = CHARACTERS[id];
    const hh = who ? heightOf(id) : H(), k = hh / H();
    const pose = an ? poseFor({ ...dummy(), swing: { anim: an, t: (t % 1.2) * 0.42, kind: 'hit' }, state: 'ground' }, t) : poseFor(dummy(), t);
    og.clearRect(0, 0, 256, 256);
    drawAthlete(og, ch, pose, t);
    g.clearRect(0, 0, 400, 300);
    g.fillStyle = css('--sky') || '#bfe6f7'; g.fillRect(0, 0, 400, 300);
    g.fillStyle = css('--sand') || '#f4dfae'; g.fillRect(0, 300 - FEET - 12, 400, FEET + 12);
    const foot = 300 - FEET - 12, cx = 160;
    g.drawImage(off, cx - 128 * k, foot - (256 - FEET) * k, 256 * k, 256 * k); // tamanho pela altura do atleta
    const W = 150; // largura da hitbox desenhada
    if (zones) {
      for (const b of bands(hh)) {
        const y0 = foot - b.hi * PX, y1 = foot - b.lo * PX;
        g.fillStyle = b.cor + '44'; g.fillRect(cx - W / 2, y0, W, y1 - y0);
        g.strokeStyle = b.cor; g.lineWidth = 3; g.strokeRect(cx - W / 2, y0, W, y1 - y0);
        g.fillStyle = b.cor; g.fillRect(cx + W / 2 + 14, y0 + 4, 10, 10);
        g.fillStyle = '#10233d'; g.font = "900 13px Nunito, sans-serif"; g.fillText(b.nome, cx + W / 2 + 28, y0 + 14);
        g.font = "800 12px Nunito, sans-serif"; g.fillText(`${b.lo.toFixed(2)}–${b.hi.toFixed(2)} m`, cx + W / 2 + 28, y0 + 29);
      }
    }
    if (special) {
      const top = Math.max(0.5, (+data.hitboxEspecial.ate || 1.4) * hh);
      g.setLineDash([7, 5]); g.strokeStyle = '#d99a00'; g.lineWidth = 3;
      g.strokeRect(cx - W / 2 - 8, foot - top * PX, W + 16, top * PX);
      g.setLineDash([]); g.fillStyle = '#7a5400'; g.font = "900 12px Nunito, sans-serif";
      g.fillText(`Especial · 0–${top.toFixed(2)} m`, cx - W / 2 - 4, foot - top * PX - 6);
    }
    // régua da altura do atleta
    g.strokeStyle = '#10233d'; g.lineWidth = 2; g.beginPath(); g.moveTo(30, foot); g.lineTo(30, foot - hh * PX); g.stroke();
    g.fillStyle = '#10233d'; g.font = "900 12px Nunito, sans-serif"; g.fillText(`${hh.toFixed(2)} m`, 6, foot - hh * PX - 6);
    if (who) g.fillText(ch ? ch.name : '', 6, 16);
  } };
}

// ---------- seções ----------
function secHitbox(ed) {
  const a = athleteFig({ zones: true, special: true });
  const figs = el('div', 'figs'); figs.append(fig(`Hitbox de ${P('A')} e ${P('B')} (3 partes) e a do especial (tracejada)`, a.c));
  ed.append(card('', el('div', 'title-row', '<h2>🎯 Hitbox em 3 partes</h2>'), figs,
    hint(`Segurando ${P('A')} (ataque) ou ${P('B')} (defesa), a hitbox aparece com as 3 partes, cada uma na sua cor. A parte em que a bola entra escolhe o golpe (aba "Golpes de cada parte"). Os especiais usam a hitbox inteira, do pé até o topo tracejado.`)));
  ed.append(card('Atleta', row('Altura do atleta', slider(data.alturaAtleta, v => { data.alturaAtleta = v; changed(); }, { min: 1.4, max: 2.2, step: 0.01, unit: 'm' })),
    hint('Altura padrão (quem não tem altura própria; veja "Altura dos atletas"). As partes são frações da altura de cada atleta. A largura e o alcance para frente/trás continuam os do editor de golpes (hitbox e alcance).')));
  const COLORS = [['#3d8bff', 'Azul'], ['#ffc21a', 'Amarelo'], ['#ff3b4f', 'Vermelho'], ['#39ff88', 'Verde'], ['#b45cff', 'Roxo'], ['#ff8a1f', 'Laranja'], ['#ffffff', 'Branco']];
  for (const k of [...ZK].reverse()) {
    const z = data.zonas[k], i = ZK.indexOf(k);
    const minAte = i ? (+data.zonas[ZK[i - 1]].ate || 0) + 0.02 : 0.1;
    // 5.0: o que a parte faz na bola (em cima: mais alta, precisa e forte; embaixo: o espelho) e o Banana Shot
    const fx = z.efeito = z.efeito || { altura: 0, precisao: 0, forca: 0, distancia: 0, banana: 0 };
    if (fx.distancia === undefined) fx.distancia = 0;
    const pct = (key, label, min, max) => row(label, slider(Math.round((+fx[key] || 0) * 100), v => { fx[key] = v / 100; changed(); }, { min, max, step: 1, unit: '%' }));
    const c = card('', fields(
      col(row('Nome', text(z.nome, v => { z.nome = v || k; changed(); renderNav(); }, { max: 20 })),
          row('Vai até', slider(z.ate, v => { z.ate = v; changed(); }, { min: minAte, max: 1.8, step: 0.01, unit: '× altura' }))),
      col(row('Cor', color(COLORS, z.cor, (v, live) => { z.cor = v; changed(); if (!live) render(); }))),
      col(pct('altura', 'Bola mais alta', -40, 40), pct('precisao', 'Mais precisa', -40, 40)),
      col(pct('forca', 'Mais forte', -40, 40), pct('distancia', 'Mais longe (distância)', -40, 40)),
      col(pct('banana', 'Chance de Banana Shot', 0, 100)),
    ), hint((i === 0 ? 'Começa no pé.' : `Começa onde a parte "${data.zonas[ZK[i - 1]].nome}" acaba.`) + ' Bola mais alta / precisa / forte / longe: + deixa mais, − deixa menos (0 = sem mudança). Mais longe = a distância da bola do botão (X / B) até o centro da área onde ela cai. Banana Shot = a bola faz uma curva para o lado no caminho.'));
    c.classList.add('zone-card'); c.style.setProperty('--c', z.cor);
    c.prepend(el('h4', '', `Parte ${['inferior', 'do tronco', 'superior'][i]}`));
    ed.append(c);
  }
  ed.append(card('Ataque depois de passes e Banana Shot', fields(
    col(row('Bônus por passe', slider(Math.round((+data.bonusPasse || 0) * 100), v => { data.bonusPasse = v / 100; changed(); }, { min: 0, max: 60, step: 1, unit: '%' }))),
    col(row('Curva do Banana Shot', slider(+data.bananaCurva || 1.4, v => { data.bananaCurva = v; changed(); }, { min: 0, max: 4, step: 0.1, unit: 'm' })))),
    hint('A cada passe antes do ataque, a bola do ataque fica esta porcentagem mais precisa e mais forte, acumulando: com 25%, atacar no 2º toque dá +25% e no 3º toque +50%. Assim não compensa atacar sempre logo no 1º ou 2º toque. A curva é quanto a bola do Banana Shot desvia para o lado no meio do caminho.')));
  { const A = data.aproximacao;
    ed.append(card('Chegar até a bola', fields(
      col(row('Desliza se a bola estiver a mais de', slider(+A.perto, v => { A.perto = v; changed(); }, { min: 0.1, max: 1.5, step: 0.05, unit: 'm' })),
        row('Velocidade do deslize', slider(+A.velocidade, v => { A.velocidade = v; changed(); }, { min: 2, max: 20, step: 0.5, unit: 'm/s' }))),
      col(row('Duração mínima', slider(+A.min, v => { A.min = v; changed(); }, { min: 0, max: 0.3, step: 0.01, unit: 's' })),
        row('Duração máxima', slider(+A.max, v => { A.max = v; changed(); }, { min: 0.05, max: 0.5, step: 0.01, unit: 's' })))),
      hint('Quando a bola entra na hitbox mas o corpo do atleta está longe dela, ele desliza até a bola antes do toque (a bola espera esse instante), para parecer que realmente a alcançou. Vale para todos (gente e CPU), menos no Kids Mode, que tem o deslize próprio.'))); }
  // 5.0: rede e atleta que já tocou
  ed.append(card('Bola do outro lado da rede', row('Pode tocar até passar', slider(Math.round(+data.rede.limiteBola * 100), v => { data.rede.limiteBola = v / 100; changed(); }, { min: 0, max: 50, step: 1, unit: '% da bola' })),
    hint('O atleta só alcança a bola do próprio lado: se mais que esta parte da bola já passou da rede, ninguém (gente ou CPU) consegue tocar. 10% = quase nada pode passar.')));
  ed.append(card('Depois do toque', row('Opacidade de quem já tocou', slider(Math.round(+data.aposToque.opacidade * 100), v => { data.aposToque.opacidade = v / 100; changed(); }, { min: 10, max: 100, step: 5, unit: '%' })),
    hint('Na dupla (e na trinca), quem acabou de tocar não pode tocar de novo: fica com esta opacidade até o parceiro tocar ou a bola passar a rede. Vale para todos os atletas.')));
  ed.append(card('Hitbox do especial', row('Vai até', slider(data.hitboxEspecial.ate, v => { data.hitboxEspecial.ate = v; changed(); }, { min: 0.6, max: 1.8, step: 0.01, unit: '× altura' })),

function courtFig(drawFn) {
  const c = canvas(520, 300), g = c.getContext('2d');
  const M = 26, X0 = 26, Z0 = 150; // 1 m = 26 px; nosso lado à esquerda (x = −9 a 0), rede no meio
  const P = (x, z) => [X0 + (9 - x) * M, Z0 + z * M]; // x = distância da rede no nosso lado
  return { c, paint: () => {
    g.fillStyle = css('--sand') || '#f4dfae'; g.fillRect(0, 0, 520, 300);
    g.strokeStyle = '#1d5cff'; g.lineWidth = 3;
    g.strokeRect(X0, Z0 - 4.5 * M, 18 * M, 9 * M);
    g.fillStyle = '#10233d'; g.fillRect(X0 + 9 * M - 2, Z0 - 4.5 * M - 8, 4, 9 * M + 16);
    g.font = "900 12px Nunito, sans-serif"; g.fillText('rede', X0 + 9 * M + 6, Z0 - 4.5 * M - 2);
    g.fillText('câmera ↓', 8, 292);
    drawFn(g, P, M);
  } };
}

  ed.append(el('h3', '', 'Agilidade'),
    eff('agilidade', 'velocidadeQuadra', 'Velocidade na quadra', 'Multiplica a velocidade da corrida do atleta.'),
    eff('agilidade', 'recuperacao', 'Tempo de recuperação', 'Multiplica o tempo para voltar a agir depois do golpe, do carrinho e da queda. Menor = melhor (por isso o padrão é negativo por ponto).'));
  ed.append(el('h3', '', 'Precisão'),
    eff('precisao', 'erroMira', 'Erro da mira', 'Onde a bola cai dentro da área do golpe: 0% = sempre no centro, 100% = pode cair na borda. Menor = mais preciso (por isso o padrão é negativo por ponto). Fica entre 0% e 100%.', { baseMax: 1, perMax: 0.3, clamp: [0, 1] }));
  ed.append(el('h3', '', 'Pique'),
    eff('pique', 'barraEspecial', 'Barra de especial', 'Multiplica quanto a barra de especial enche a cada toque e a cada ponto.', { clamp: [0, 9] }),
    eff('pique', 'notaRuim', 'Peso das notas ruins', 'Multiplica o empurrão (nota Ruim) e o tempo no chão (nota Pior) depois de um toque mal feito. Menor = melhor.', { clamp: [0, 9] }));
}

// ---------- 5.0: aba Campeonato e sorteio ----------
function secCampeonato(ed) {
  const C = data.campeonato, Q = data.caraOuCoroa;
  const numIn = (obj, k, opts) => slider(+obj[k], v => { obj[k] = v; changed(); }, opts);
  ed.append(card('', el('div', 'title-row', '<h2>🏆 Campeonato e sorteio</h2>'),
    hint('Modo Campeonato com as regras oficiais do futevôlei no Brasil: mata-mata de 8 duplas em 3 chaves — quartas de final (chave 1), semifinal (chave 2), disputa de 3º lugar e final (chave 3). Vence o set quem chega aos pontos com 2 de diferença. A troca de lado é a cada N pontos somados, sem pausa; cada dupla tem tempos técnicos na partida (com consumíveis).'),
    row('Nome do campeonato', text(C.nome, v => { C.nome = v; changed(); }, { max: 40 }))));
  const phase = (key, title) => card(title, fields(col(row('Pontos do set', numIn(C[key], 'pontos', { min: 3, max: 30, step: 1, unit: 'pts' }))), col(row('Troca de lado a cada', numIn(C[key], 'trocaLado', { min: 2, max: 12, step: 1, unit: 'pts' })))));
  ed.append(phase('quartas', 'Quartas de final · chave 1 (set único)'), phase('semifinal', 'Semifinal · chave 2 (set único)'), phase('terceiro', 'Disputa de 3º lugar · chave 3 (set único)'));
  const F = C.final;
  ed.append(card('Final (melhor de 3 sets)', fields(
    ...[0, 1, 2].map(i => col(row(`${i + 1}º set${i === 2 ? ' (decisivo)' : ''}: pontos`, slider(+F.sets[i], v => { F.sets[i] = v; changed(); }, { min: 3, max: 30, step: 1, unit: 'pts' })),
      row('troca de lado a cada', slider(+F.trocaLado[i], v => { F.trocaLado[i] = v; changed(); }, { min: 2, max: 12, step: 1, unit: 'pts' }))))),
    hint('Oficial: 18, 18 e 15 pontos; troca a cada 6 (e a cada 5 no set decisivo). Intervalo entre sets; no 2º set escolhe quem perdeu o sorteio, no 3º há novo cara ou coroa.')));
  ed.append(card('Tempos técnicos', row('Tempos técnicos por dupla', numIn(C, 'temposTecnicos', { min: 0, max: 4, step: 1, unit: 'por partida' })),
    hint('A CPU pede o tempo técnico dela quando perde por 3 ou mais na reta final do set.')));
  // 5.0: nível das CPUs em cada chave, por dificuldade (Escada); o Aleatório sorteia entre o menor e o maior
  const D = C.dificuldades;
  ed.append(card('Dificuldade das CPUs (nível 1 a 12)', fields(
    ...[['facil', 'Fácil'], ['medio', 'Médio'], ['dificil', 'Difícil']].map(([k, nm]) => col(...[0, 1, 2].map(i => row(`${nm} · chave ${i + 1}`, slider(+D[k][i], v => { D[k][i] = v; changed(); }, { min: 1, max: 12, step: 1, unit: 'nível' })))))),
    hint('O jogador escolhe a dificuldade e o modo ao criar o campeonato. Escada: as CPUs têm o nível da chave (sobe a cada chave). Aleatório: cada dupla da CPU sorteia um nível entre o menor e o maior da dificuldade e fica com ele no campeonato todo. O parceiro da CPU de quem joga sozinho tem o nível da chave.')));
  ed.append(card('Premiação (R$ na carteira do Campeonato)', fields(
    ...[0, 1, 2].map(i => col(row(`${i + 1}º lugar`, slider(+C.premios[i] || 0, v => { C.premios[i] = v; changed(); }, { min: 0, max: 5000, step: 10, unit: 'R$' }))))),
    hint('1º lugar: troféu e medalha de ouro; 2º: prata; 3º: bronze. O dinheiro vai para a carteira do Campeonato e pode ser depositado num jogo salvo do Modo História.')));
  const climas = [['aleatorio', 'Sorteado a cada partida'], ['nenhum', 'Sem clima'], ['chuva', 'Chuva'], ['vento', 'Vento forte'], ['sol', 'Sol forte']];
  ed.append(card('Arena e clima', fields(
    col(row('Arena', select(Object.keys(HOODS).map(k => [k, HOODS[k].name || k]), C.arena, v => { C.arena = v; changed(); }))),
    col(row('Clima', select(climas, C.clima, v => { C.clima = v; changed(); })))),
    hint('A arena é o bairro onde o campeonato acontece.')));
  ed.append(card('Cara ou coroa (todas as partidas)', row('A CPU escolhe o saque', slider(Math.round(+Q.cpuSaque * 100), v => { Q.cpuSaque = v / 100; changed(); }, { min: 0, max: 100, step: 5, unit: '%' })),
    hint('No início de cada partida (Exibição, História e Campeonato) há cara ou coroa: o jogador pede cara ou coroa; quem ganha escolhe o saque ou o lado da quadra, e a outra dupla escolhe o que sobrou (o lado, ou sacar / receber). Quando a CPU ganha, ela escolhe o saque com esta chance (senão, o lado); quando ela escolhe sacar ou receber, saca com esta chance.')));
}
function render() {
  cancelAnimationFrame(anim); painters = [];
  renderNav();
  const ed = document.getElementById('editor');
  ed.innerHTML = '';
  V5.controle = data.controle; // os nomes dos botões (em todas as abas) seguem a troca feita aqui
  ({ atributos: secAtributos, hitbox: secHitbox, alturas: secAlturas, golpes: secGolpes, especiais: secEspeciais, historia: secHistoria, formacoes: secFormacoes, saque: secSaque, controle: secControle, campeonato: secCampeonato })[cur](ed);
}
render();
</script>
